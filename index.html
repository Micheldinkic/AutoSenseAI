<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoSense AI</title><style>body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:40px} .card{max-width:800px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)} input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc} button{background:#2563eb;color:#fff;border:none;font-weight:bold} .result{display:none;margin-top:20px;padding:15px;background:#f9fafb;border-radius:10px}</style></head><body><div class="card"><h1>🚗 AutoSense AI</h1><p>Der ehrliche digitale Mechaniker</p><input id="vehicle" value="Audi A8 4.0 TDI"><input id="code" placeholder="Fehlercode (z.B. P0087)"><select id="symptom"><option>Symptom auswählen</option><option>Motor geht aus</option><option>Startet nicht mehr</option><option>Leistungsverlust</option></select><button onclick="analyze()">Analyse starten</button><div id="result" class="result"></div></div><script>function analyze(){const code=document.getElementById('code').value.toUpperCase();const r=document.getElementById('result');if(code.includes('P0087')){r.innerHTML='<h3>Diagnose-Ergebnis</h3><p><b>Problem:</b> Kraftstoffversorgung gestört</p><p><b>Weiterfahren:</b> Nein</p><p><b>Wahrscheinlichste Ursache:</b> Vorförderpumpe (82%)</p><p><b>Typische Kosten:</b> 250-700 €</p>'; } else {r.innerHTML='<h3>Weitere Analyse erforderlich</h3><p>Fehlercode nicht in Datenbank.</p>';}r.style.display='block';}</script></body></html>
